<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>High School Student OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root { height: 100%; }
    body { margin: 0; font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-[#F7F8FA] text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
  <div id="root"></div>
  <!-- Modules load in dependency order: data -> store -> ui -> agents -> features -> app -->
  <script type="text/babel" src="js/data.js"></script>
  <script type="text/babel" src="js/store.js"></script>
  <script type="text/babel" src="js/ui.js"></script>
  <script type="text/babel" src="js/agents/ap.js"></script>
  <script type="text/babel" src="js/agents/dsat.js"></script>
  <script type="text/babel" src="js/agents/admissions.js"></script>
  <script type="text/babel" src="js/features.js"></script>
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
