# Worker service (Cloud Run). Project, URLs and service accounts are set by provision.sh.
HSOS_APP_ENV: staging
HSOS_ASGI_APP: app.workers.main:app
HSOS_LOG_FORMAT: json
HSOS_STORAGE_PROVIDER: firestore
HSOS_QUEUE_PROVIDER: cloud_tasks
HSOS_CLOUD_TASKS_QUEUE: runs
HSOS_LLM_PROVIDER: anthropic
HSOS_LLM_TIMEOUT_SECONDS: "60"
HSOS_LLM_MAX_ATTEMPTS: "3"
# Must exceed timeout x attempts (180 s): config refuses to start otherwise.
HSOS_RUN_LEASE_SECONDS: "300"
HSOS_RUN_REQUEUE_AFTER_SECONDS: "600"
HSOS_LLM_DAILY_TOKEN_BUDGET: "200000"
HSOS_REQUIRE_REVIEWED_CONTENT: "false"
# Staging: fake sender behind the test-recipient guard. Only these synthetic students
# can receive reminders; production refuses the fake provider.
HSOS_REMINDER_PROVIDER: fake
HSOS_REMINDER_TEST_RECIPIENTS: '["stu_alex","stu_beth"]'
